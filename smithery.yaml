name: qmax-mcp
displayName: QualityMax QA MCP
description: >
  Local-first QA MCP server: scan URLs, inspect pages, generate Playwright repros,
  and run tests locally.
version: 0.9.0
homepage: https://qmax.run
logo: https://app.qualitymax.io/static/img/logo.png

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |
    () => ({
      command: "npx",
      args: ["-y", "@qualitymax/qmax-mcp"]
    })
