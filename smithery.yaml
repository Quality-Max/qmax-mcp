name: qmax-mcp
displayName: QualityMax QA MCP
description: >
  Final release: these checks moved to 9lives (`9l mcp`). Local-first QA MCP
  server: scan URLs, inspect pages, generate Playwright repros, and run tests locally.
version: 0.9.2
homepage: https://9lives.run/#page-checks
logo: https://app.qualitymax.io/static/img/logo.png

startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
  commandFunction: |
    () => ({
      command: "npx",
      args: ["-y", "@qualitymax/qmax-mcp"]
    })
