name: Publish to MCP Registry

# Runs after the npm release, never before it: the registry entry points at an
# npm version, so publishing first would advertise a package nobody can install.
# The release workflow calls this once npm has published; dispatch it by hand
# only to recover a release whose registry step failed. Re-running it for a
# version the registry already has is safe: the publish is skipped and the
# entry is confirmed.
on:
  workflow_call:
    inputs:
      release_tag:
        description: Immutable annotated tag already published to npm (for example, v0.3.0).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable annotated tag already published to npm (for example, v0.3.0).
        required: true
        type: string

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  resolve-release:
    name: Resolve immutable release tag
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
      package_version: ${{ steps.release.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          # Normally dispatch from the immutable tag. Allow main as a recovery
          # ref so a workflow-only fix can publish an existing release without
          # moving or recreating its tag; every published artifact is still
          # checked out from and verified against RELEASE_TAG below.
          case "${WORKFLOW_REF}" in
            "refs/tags/${RELEASE_TAG}"|"refs/heads/main") ;;
            *) echo "Dispatch from ${RELEASE_TAG} or main." >&2; exit 1 ;;
          esac
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" = "$(git rev-parse HEAD)"
          test "${RELEASE_TAG}" = "v$(node -p "require('./package.json').version")"
          release_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${release_sha}" origin/main
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"
          echo "package_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  publish-registry:
    name: Publish server.json with OIDC
    needs: resolve-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC is the whole point: no registry token to store or rotate.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install validation dependencies
        run: npm ci --ignore-scripts --engine-strict

      - name: Verify metadata agrees with the tag
        run: node scripts/sync-version.cjs --check

      - name: Validate server.json against the registry schema
        run: node scripts/validate-registry-contract.cjs

      - name: Require the npm version to exist first
        env:
          PACKAGE_VERSION: ${{ needs.resolve-release.outputs.package_version }}
        run: |
          # The registry entry advertises this exact npm version. Refuse to
          # publish a pointer to something the public registry cannot serve.
          # Called straight after `npm publish`, the version can take a few
          # minutes to appear ("Your package is being processed"), so wait for
          # it rather than failing a release that is still propagating.
          published=""
          for attempt in $(seq 1 30); do
            published="$(npm view --prefer-online "@qualitymax/qmax-mcp@${PACKAGE_VERSION}" version 2>/dev/null || true)"
            if [ "${published}" = "${PACKAGE_VERSION}" ]; then break; fi
            echo "npm does not serve ${PACKAGE_VERSION} yet (attempt ${attempt}/30)"
            sleep 10
          done
          test "${published}" = "${PACKAGE_VERSION}"
          # Ownership check the registry performs: package.json mcpName must
          # match server.json name, in the published tarball, not just here.
          mcp_name="$(npm view "@qualitymax/qmax-mcp@${PACKAGE_VERSION}" mcpName)"
          test "${mcp_name}" = "$(node -p "require('./server.json').name")"

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Check whether the registry already has this version
        id: existing
        env:
          PACKAGE_VERSION: ${{ needs.resolve-release.outputs.package_version }}
        run: |
          set -euo pipefail
          # The registry rejects a second publish of the same version, so a
          # re-run after a successful publish (say, one whose confirmation hit
          # a registry timeout) skips straight to confirming the entry.
          # curl retries 5xx and timeouts; a 404 is the answer, not a fault.
          server="$(node -p "encodeURIComponent(require('./server.json').name)")"
          status="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 --max-time 60 \
            "https://registry.modelcontextprotocol.io/v0/servers/${server}/versions/${PACKAGE_VERSION}")"
          echo "registry answered ${status} for ${PACKAGE_VERSION}"
          case "${status}" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac

      - name: Authenticate to the MCP Registry
        if: steps.existing.outputs.published != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: steps.existing.outputs.published != 'true'
        run: ./mcp-publisher publish

      - name: Confirm the entry is live
        env:
          PACKAGE_VERSION: ${{ needs.resolve-release.outputs.package_version }}
        run: |
          set -euo pipefail
          # Ask for this server's latest version directly. The search endpoint
          # used before returned every version of every match and timed out
          # with a 504 on the 0.9.1 release, failing a run whose publish had
          # succeeded. A single attempt is not a verdict either way, so retry
          # both transport errors and an entry that has not propagated yet.
          server="$(node -p "encodeURIComponent(require('./server.json').name)")"
          listed="missing"
          for attempt in $(seq 1 10); do
            listed="$(curl -fsS --max-time 60 \
              "https://registry.modelcontextprotocol.io/v0/servers/${server}/versions/latest" | node -e "
                let raw = '';
                process.stdin.on('data', (chunk) => (raw += chunk)).on('end', () => {
                  const entry = JSON.parse(raw);
                  const meta = (entry._meta || {})['io.modelcontextprotocol.registry/official'] || {};
                  process.stdout.write(meta.isLatest === false ? 'not-latest' : (entry.server || entry).version);
                });
              " || echo "unavailable")"
            echo "registry reports: ${listed} (attempt ${attempt}/10)"
            if [ "${listed}" = "${PACKAGE_VERSION}" ]; then break; fi
            sleep 15
          done
          test "${listed}" = "${PACKAGE_VERSION}"
