name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run check
      - run: npm run eval:agent-discovery

  # Job id and display name are load-bearing: "Demo flow" is a required status
  # check in branch protection, so renaming either silently blocks every PR on a
  # check that can no longer report. Add steps here rather than renaming.
  demo:
    name: Demo flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      # The demo executes a real Playwright test, so this job needs the browser that `check` does not.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:demo
      # Same reason: the accessibility rules run in page context, so they can only
      # be held still by driving real DOM.
      - run: npm run test:browser
