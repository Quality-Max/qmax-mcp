name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run check
      - run: npm run eval:agent-discovery

  # Runs the demo and the browser-backed accessibility fixtures: both need the
  # Playwright browser that `check` deliberately does not install.
  #
  # Safe to rename now — branch protection requires the `gate` job below rather
  # than this name. That was not true before #75: this job's display name was a
  # required check, so renaming it left every PR waiting on a status that could
  # no longer be reported.
  demo:
    name: Browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      # The demo executes a real Playwright test, so this job needs the browser that `check` does not.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:demo
      # Same reason: the accessibility rules run in page context, so they can only
      # be held still by driving real DOM.
      - run: npm run test:browser

  # The single required status check for this workflow.
  #
  # Branch protection names a check by its *display name*, so requiring the real
  # jobs directly makes every one of those names load-bearing: renaming a job, or
  # changing a matrix entry, leaves protection waiting on a status that can no
  # longer be reported. The PR then sits on "Expected — Waiting for status to be
  # reported" while the renamed job goes green next to it, which reads as a slow
  # runner rather than a misconfiguration.
  #
  # Requiring this job instead means only one name has to stay fixed, and it is
  # named for that purpose. The jobs above are free to be renamed, split, or
  # extended as long as they stay in `needs`.
  #
  # `if: always()` is required so the gate still reports when a dependency fails;
  # without it the job is skipped and protection waits forever, which is the very
  # failure this exists to prevent.
  gate:
    name: All checks
    if: always()
    needs: [check, demo]
    runs-on: ubuntu-latest
    steps:
      - name: Require every dependency to have succeeded
        run: |
          echo "check: ${{ needs.check.result }}"
          echo "demo:  ${{ needs.demo.result }}"
          # Explicit per-job comparison rather than a search over toJSON(needs):
          # 'success' is the only acceptable result, so cancelled and skipped fail
          # too. A new entry in `needs` must be added here as well, and forgetting
          # to is a visible omission rather than a silent pass.
          [ "${{ needs.check.result }}" = "success" ] || { echo "::error::check did not succeed"; exit 1; }
          [ "${{ needs.demo.result }}" = "success" ] || { echo "::error::demo did not succeed"; exit 1; }
          echo "All required jobs succeeded."
