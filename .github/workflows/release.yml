name: Release package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable annotated tag matching package.json (for example, v0.1.0).
        required: true
        type: string
      publish:
        description: Publish the verified, approved tag after all release gates are approved.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve immutable release tag
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" = "$(git rev-parse HEAD)"
          test "${RELEASE_TAG}" = "v$(node -p "require('./package.json').version")"
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-package:
    name: Verify package (Node ${{ matrix.node }})
    needs: resolve-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run check
      - run: npm pack --json --ignore-scripts

  publish:
    name: Publish with provenance
    needs: [resolve-release, verify-package]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@qualitymax/qmax-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run check
      - run: npm publish --provenance --access public
