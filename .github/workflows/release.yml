name: Release package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Immutable annotated tag matching package.json (for example, v0.1.0).
        required: true
        type: string
      publish:
        description: Publish the verified, approved tag after all release gates are approved.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve-release:
    name: Resolve immutable release tag
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "${WORKFLOW_REF}" = "refs/tags/${RELEASE_TAG}"
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" = "$(git rev-parse HEAD)"
          test "${RELEASE_TAG}" = "v$(node -p "require('./package.json').version")"
          release_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${release_sha}" origin/main
          echo "release_sha=${release_sha}" >> "$GITHUB_OUTPUT"

  verify-package:
    name: Verify package (Node ${{ matrix.node }})
    needs: resolve-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run check
      - run: npm pack --json --ignore-scripts

  publish:
    name: Publish with provenance
    needs: [resolve-release, verify-package]
    if: inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@qualitymax/qmax-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts --engine-strict
      - run: npm run check
      - run: npm publish --provenance --access public

  # npm, then the MCP Registry, then the GitHub Release: each surface advertises
  # the one before it, so each runs only once the previous one succeeded. The
  # registry workflow stays dispatchable on its own to recover a failed step.
  publish-registry:
    name: Publish to MCP Registry
    needs: publish
    uses: ./.github/workflows/publish-mcp-registry.yml
    permissions:
      contents: read
      id-token: write
    with:
      release_tag: ${{ inputs.release_tag }}

  github-release:
    name: Publish GitHub Release
    needs: [resolve-release, publish-registry]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.release_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Create the release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_SHA: ${{ needs.resolve-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already has a GitHub Release; leaving it as written."
            exit 0
          fi
          version="${RELEASE_TAG#v}"
          node scripts/release-notes.cjs "${version}" --sha "${RELEASE_SHA}" > release-notes.md
          # --verify-tag: without it a missing tag is created from the default
          # branch, attaching the release to a commit nobody published.
          gh release create "${RELEASE_TAG}" --verify-tag \
            --title "qmax-mcp ${version}" --notes-file release-notes.md
