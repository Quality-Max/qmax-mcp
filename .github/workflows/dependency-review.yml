name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # GitHub only supports this action for public repositories or private
    # repositories with GitHub Advanced Security. Keep it ready for public
    # launch without failing the current private repository's required checks.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
