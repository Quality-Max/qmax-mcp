name: Dependency review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    # GitHub only supports this action for public repositories or private
    # repositories with GitHub Advanced Security. Keep it ready for public
    # launch without failing the current private repository's required checks.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
