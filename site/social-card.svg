<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">qmax by QualityMax</title>
  <desc id="desc">Independent QA evidence for coding agents.</desc>
  <defs>
    <style>
      @font-face { font-family: 'Space Grotesk'; src: url('space-grotesk-latin.woff2') format('woff2'); font-weight: 300 700; }
      @font-face { font-family: 'DM Sans'; src: url('dm-sans-latin.woff2') format('woff2'); font-weight: 400 700; }
      .display { font-family: 'Space Grotesk', sans-serif; }
      .body { font-family: 'DM Sans', sans-serif; }
    </style>
    <linearGradient id="copy-safe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".98"/>
      <stop offset=".48" stop-color="#fff" stop-opacity=".93"/>
      <stop offset=".66" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="command" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".94"/>
      <stop offset="1" stop-color="#f5f3ff" stop-opacity=".88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#3730a3" flood-opacity=".10"/>
    </filter>
  </defs>

  <image href="social-card-bg.png" width="1200" height="630" preserveAspectRatio="xMidYMid slice"/>
  <rect width="840" height="630" fill="url(#copy-safe)"/>

  <image href="qualitymax-logo-black.png" x="72" y="58" width="226" height="34"/>
  <g transform="translate(324 54)">
    <rect width="214" height="42" rx="21" fill="#fff" stroke="#ddd6fe"/>
    <circle cx="22" cy="21" r="5" fill="#6366f1"/>
    <text class="body" x="36" y="26" fill="#4c1d95" font-size="13" font-weight="700" letter-spacing="1.15">OPEN SOURCE · LOCAL</text>
  </g>

  <text class="display" x="72" y="188" fill="#18181b" font-size="49" font-weight="300" letter-spacing="-2"><tspan font-weight="700">q</tspan>max</text>
  <text class="display" x="72" y="260" fill="#18181b" font-size="57" font-weight="700" letter-spacing="-1.7">Independent QA evidence</text>
  <text class="display" x="72" y="326" fill="#18181b" font-size="57" font-weight="700" letter-spacing="-1.7">for coding agents<tspan fill="#6366f1">.</tspan></text>
  <text class="body" x="74" y="382" fill="#52525b" font-size="22">Inspect the browser. Reproduce the failure. Ship the proof.</text>

  <g transform="translate(72 426)" filter="url(#shadow)">
    <rect width="530" height="68" rx="16" fill="url(#command)" stroke="#e4e4e7"/>
    <circle cx="26" cy="34" r="6" fill="#34d399"/>
    <text x="48" y="42" fill="#27272a" font-family="Menlo, Consolas, monospace" font-size="20">npx -y @qualitymax/qmax-mcp</text>
  </g>

  <g transform="translate(74 561)">
    <circle cx="5" cy="-7" r="5" fill="#6366f1"/>
    <text class="body" x="22" y="0" fill="#3f3f46" font-size="19" font-weight="700" letter-spacing="1.3">QMAX.RUN</text>
  </g>
</svg>
